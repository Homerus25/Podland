name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        required: false
        default: "latest"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip work-in-progress pull requests. Forgejo marks those by a WIP title
    # prefix (and a draft flag); pushes to master and manual dispatches always run.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       !startsWith(github.event.pull_request.title, 'WIP') &&
       !startsWith(github.event.pull_request.title, 'wip') &&
       !startsWith(github.event.pull_request.title, '[WIP]') &&
       !startsWith(github.event.pull_request.title, '[wip]'))
    runs-on: build
    env:
      IMAGE: rack.home:9250/homerus/podland
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Forgejo's registry on :9250 is plain HTTP; without --tls-verify=false
      # podman pings https://.../v2/ and aborts before sending credentials.
      # The run-scoped GITHUB_TOKEN can log in but lacks package-write scope,
      # so pushes authenticate with PODLAND_CI_TOKEN.
      - name: Log in to container registry
        run: echo "${{ secrets.PODLAND_CI_TOKEN }}" | podman login rack.home:9250 -u homerus --password-stdin --tls-verify=false

      - name: Determine image tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-latest}"
          else
            TAG="latest"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # Same three named contexts as the documented build (README/Containerfile).
      # The podman fork is not cloned here: the build runner keeps a persistent,
      # up-to-date checkout at /root/podman (baked into the runner image), which
      # doubles as a warm cache for the fork's source.
      - name: Build image
        working-directory: backend
        run: |
          podman build \
            --build-context backend=. \
            --build-context frontend=../frontend \
            --build-context podman=/root/podman \
            -t "$IMAGE:$TAG" ..

      - name: Push image
        run: podman push --tls-verify=false "$IMAGE:$TAG"
